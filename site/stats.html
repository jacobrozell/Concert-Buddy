<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stats · {{site_title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="Stats · {{site_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{site_url}}assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#16121c">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
/* Stats: the numbers, the songs you keep hearing, who and where — all worked out by build.py into data/stats.json. */
.crumb{padding-block:22px 0;font-family:var(--mono);font-size:12.5px;display:flex;gap:18px}
.crumb a{text-decoration:none;color:var(--muted)} .crumb a:hover{color:var(--fg)}

.hero{padding-block:30px 8px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(56px,9vw,112px);line-height:.84;margin:10px 0 0;text-transform:uppercase}
h1 span{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;margin-top:30px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--bg);padding:16px 18px 14px;min-width:0}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

section.block{margin-top:56px}
.block>h2{font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1;margin:0 0 4px}
.block>.sub{color:var(--muted);margin:0 0 18px;font-size:14px;max-width:70ch}
.block>.sub a{color:var(--fg)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.cols>section.block{min-width:0}

/* most-heard songs */
.songs{list-style:none;margin:0;padding:0;counter-reset:n}
.songs li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 16px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.songs .rank{font-family:var(--mono);font-size:13px;padding-top:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.songs .t{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;overflow-wrap:anywhere}
.songs .by{font-size:13.5px;color:var(--muted)}
.songs .by a{color:var(--fg);text-decoration:none} .songs .by a:hover{text-decoration:underline}
.songs .x{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.times{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.times a{font-family:var(--mono);font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--fg)}
.times a:hover{border-color:var(--fg)}
.times a.prov{border-style:dashed;color:var(--muted)}
.times a.film{border-color:var(--accent);color:var(--accent)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:12px}
.key i{display:inline-block;width:18px;height:10px;border:1px solid var(--line);border-radius:999px;vertical-align:-1px;margin-right:6px}
.key i.prov{border-style:dashed}.key i.film{border-color:var(--accent)}
.more{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--fg);margin-top:14px;display:inline-block;border-bottom:1px solid var(--line)}
.more:hover{border-color:var(--fg)}

/* ranked bars */
.rank-bars{display:grid;grid-template-columns:minmax(0,auto) minmax(60px,1fr) auto;gap:7px 12px;align-items:center}
.rank-bars>a,.rank-bars>span.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;color:var(--fg);font-size:14.5px}
.rank-bars>a:hover{text-decoration:underline}
.rank-bars small{color:var(--muted);font-size:12px;margin-left:6px}
.rank-bars .track{height:12px}
.rank-bars .track i{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--fg);opacity:.85;min-width:3px}
.rank-bars .c{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.rank-bars>a:first-child+.track i{background:var(--accent);opacity:1}

/* when */
.cal{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:130px;border-bottom:1px solid var(--line)}
.cal div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-family:var(--mono);font-size:11px;color:var(--muted)}
.cal i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--fg);opacity:.85}
.cal div.top i{background:var(--accent);opacity:1}
.cal-l{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.when-pair{display:grid;grid-template-columns:7fr 12fr;gap:28px}
.when-pair h3{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fact{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg-2);text-decoration:none;display:flex;flex-direction:column;gap:3px}
a.fact:hover{border-color:var(--muted)}
.fact span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fact b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.fact small{font-size:13px;color:var(--muted)}

/* everyone */
.az{columns:4 200px;column-gap:28px;font-size:14px}
.az a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;padding:3px 0;break-inside:avoid;color:var(--fg)}
.az a:hover span:first-child{text-decoration:underline}
.az a span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted)}
.az .letter{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);margin:12px 0 2px;break-after:avoid}
.az .letter:first-child{margin-top:0}

@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .when-pair{grid-template-columns:1fr}
  .songs li{grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px}
  .songs .t{font-size:22px}
  .songs .x{font-size:32px}
  .tile b{font-size:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="crumb"><a href="./">← All shows</a></nav>
  <main id="page"><div class="empty">Loading…</div></main>
  <footer class="site" id="foot"></footer>
</div>

<script src="assets/common.js"></script>
<script>
const {esc, longDate, getJSON} = CB;
const SONGS_SHOWN = 15;
const yy = d => `'${d.slice(2, 4)}`;
const hours = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.round(s % 3600 / 60)}m` : `${Math.round(s / 60)}m`;
const artistHref = slug => `artist.html?a=${encodeURIComponent(slug)}`;
const showHref = (id, act) => `show.html?id=${encodeURIComponent(id)}${act ? `#act-${act}` : ''}`;

Promise.all([getJSON('data/stats.json'), getJSON('data/concerts.json')]).then(([S, C]) => render(S, C)).catch(err => {
  document.getElementById('page').innerHTML = `<div class="empty">Couldn't load the stats. Run <code>python3 scripts/build.py --serve</code> and open the page from there.<br>${esc(err.message)}</div>`;
});

function bars(rows, {label, href, count = r => r.count, note = () => '', max = 10}){
  const list = rows.slice(0, max), top = Math.max(1, ...list.map(count));
  return `<div class="rank-bars">${list.map(r => {
    const name = href ? `<a href="${esc(href(r))}">${esc(label(r))}${note(r)}</a>` : `<span class="name">${esc(label(r))}${note(r)}</span>`;
    return `${name}<span class="track"><i style="width:${count(r) / top * 100}%"></i></span><span class="c">${count(r)}</span>`; }).join('')}</div>`;
}

function render(S, C){
  const cfg = C.config, T = S.totals, shows = C.shows;
  if (!shows.length){
    document.getElementById('page').innerHTML = `<div class="empty">No shows yet, so no stats. Add some to <code>concerts.csv</code> and they'll show up here.</div>`;
    return;
  }
  const byId = Object.fromEntries(shows.map(s => [s.id, s]));
  const y0 = shows.map(s => s.date).sort()[0]?.slice(0, 4);
  document.title = `Stats · ${cfg.site_title || 'Concert Log'}`;

  const tile = (n, label, small = '') => `<div class="tile"><b>${n}</b><span>${label}</span>${small ? `<small>${small}</small>` : ''}</div>`;
  let h = `<header class="hero"><div class="eyebrow">${esc([cfg.owner, y0 && `live music since ${y0}`].filter(Boolean).join(' · '))}</div>
    <h1>By the<br><span>numbers</span></h1>
    <div class="tiles">
      ${tile(T.shows, 'Shows')}
      ${tile(T.artists, 'Artists', 'openers included')}
      ${tile(T.songs, 'Songs heard', `${T.distinct_songs} different`)}
      ${tile(T.venues, 'Venues')}
      ${tile(T.cities, 'Cities', `in ${T.states} state${T.states > 1 ? 's' : ''}`)}
      ${T.footage_seconds ? tile(hours(T.footage_seconds), 'Of footage', `${T.clips} clips from ${T.filmed_shows} shows`) : ''}
    </div></header>`;

  // the songs you keep hearing
  if (S.top_songs.length){
    const row = (x, i) => `<li><span class="rank">${String(i + 1).padStart(2, '0')}</span>
      <div><div class="t">${esc(x.title)}</div><div class="by"><a href="${artistHref(x.slug)}">${esc(x.artist)}</a>${x.confirmed < x.count ? ` · ${x.count - x.confirmed} from provisional setlists` : ''}</div>
        <div class="times">${x.times.map(t => `<a class="${t.provisional ? 'prov' : ''}${t.filmed ? ' film' : ''}" href="${showHref(t.id, t.act)}" title="${esc(longDate(t.date))}${t.filmed ? ' · you filmed it' : ''}${t.provisional ? ' · provisional setlist' : ''}">${yy(t.date)} ${esc(byId[t.id]?.venue || '')}</a>`).join('')}</div></div>
      <span class="x">×${x.count}</span></li>`;
    h += `<section class="block"><h2>Songs you keep hearing</h2>
      <p class="sub">Songs you've heard live more than once, counted from your setlists.</p>
      <ol class="songs" id="top-songs">${S.top_songs.slice(0, SONGS_SHOWN).map(row).join('')}</ol>
      ${S.top_songs.length > SONGS_SHOWN ? `<button class="more" id="more-songs">Show all ${S.top_songs.length}</button>` : ''}
      <div class="key"><span><i></i>A night you heard it</span><span><i class="film"></i>…and filmed it</span><span><i class="prov"></i>From a provisional setlist</span></div></section>`;
    window.__songRow = row;
  }

  // who and where
  const seen = S.artists.filter(a => a.count > 1);
  h += `<div class="cols">
    <section class="block"><h2>Seen the most</h2><p class="sub">Every act counts, openers too.</p>
      ${bars(seen.length >= 3 ? seen : S.artists, {label: a => a.name, href: a => artistHref(a.slug), max: 12,
        note: a => `<small>${a.first.slice(0, 4)}${a.last.slice(0, 4) !== a.first.slice(0, 4) ? '–' + a.last.slice(2, 4) : ''}</small>`})}</section>
    <section class="block"><h2>Venues</h2><p class="sub">${T.venues} venues in ${T.cities} cities.</p>
      ${bars(S.venues, {label: v => v.venue, href: v => `./?q=${encodeURIComponent(v.venue)}`, max: 12, note: v => `<small>${esc(v.location)}</small>`})}</section>
  </div>`;

  const cols2 = [];
  if (S.companions.length) cols2.push(`<section class="block"><h2>Who you go with</h2><p class="sub">${[T.solo ? `<a href="./?with=__solo">Solo ×${T.solo}</a>` : '', T.with_unlogged ? `<a href="./?with=__none">not logged ×${T.with_unlogged}</a>` : ''].filter(Boolean).join(' · ') || 'From the “with” column.'}</p>
      ${bars(S.companions, {label: c => c.name, href: c => `./?with=${encodeURIComponent(c.name)}`, max: 8,
        note: c => `<small>since ${c.first.slice(0, 4)}</small>`})}</section>`);
  if (S.cities.length > 1) cols2.push(`<section class="block"><h2>Cities</h2><p class="sub">Where the shows were.</p>
      ${bars(S.cities, {label: c => c.location, href: c => `./?q=${encodeURIComponent(c.location)}`, max: 8})}</section>`);
  if (cols2.length) h += `<div class="cols">${cols2.join('')}</div>`;

  // when
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const cal = (vals, labels, full) => { const m = Math.max(...vals);
    return `<div class="cal">${vals.map((v, i) => `<div class="${v === m ? 'top' : ''}" title="${full[i]}: ${v} show${v === 1 ? '' : 's'}"><span>${v || ''}</span><i style="height:${v / m * 100}px"></i></div>`).join('')}</div>
      <div class="cal-l">${labels.map(l => `<span>${l}</span>`).join('')}</div>`; };
  const topDay = S.weekdays.indexOf(Math.max(...S.weekdays)), topMon = S.months.indexOf(Math.max(...S.months));
  h += `<section class="block"><h2>When</h2><p class="sub">Mostly ${DAYS[topDay]}s, and ${MONTHS[topMon]} is your busiest month.</p>
    <div class="when-pair"><div><h3>Night of the week</h3>${cal(S.weekdays, DOW, DAYS)}</div><div><h3>Month</h3>${cal(S.months, MON, MONTHS)}</div></div></section>`;

  // facts
  if (S.facts.length) h += `<section class="block"><h2>Odds and ends</h2><div class="facts">${S.facts.map(f => {
      const inner = `<span>${esc(f.label)}</span><b>${esc(f.value)}</b><small>${esc(/^\d{4}-\d\d-\d\d$/.test(f.detail) ? longDate(f.detail) : f.detail)}</small>`;
      return f.id ? `<a class="fact" href="${showHref(f.id)}">${inner}</a>` : `<div class="fact">${inner}</div>`; }).join('')}</div></section>`;

  // everyone, A–Z
  const az = [...S.artists].sort((a, b) => a.name.replace(/^the /i, '').localeCompare(b.name.replace(/^the /i, '')));
  let letter = '', list = '';
  for (const a of az){ const l = a.name.replace(/^the /i, '')[0].toUpperCase().replace(/[^A-Z]/, '#');
    if (l !== letter){ letter = l; list += `<div class="letter">${l}</div>`; }
    list += `<a href="${artistHref(a.slug)}"><span>${esc(a.name)}</span><span>${a.count > 1 ? '×' + a.count : ''}</span></a>`; }
  h += `<section class="block"><h2>Everyone you've seen</h2><p class="sub">${T.artists} acts. Each has a page with every time you saw them and every song you heard.</p><div class="az">${list}</div></section>`;

  document.getElementById('page').innerHTML = h;
  document.getElementById('more-songs')?.addEventListener('click', e => {
    document.getElementById('top-songs').innerHTML = S.top_songs.map(window.__songRow).join(''); e.target.remove(); });
  if (cfg.repo_url) document.getElementById('foot').innerHTML = `Made with ConcertBuddy — <a href="${esc(cfg.repo_url)}">grab the template and log your own shows</a>.`;
}
</script>
</body>
</html>
