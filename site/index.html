<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{site_title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{site_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{site_url}}assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#16121c">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/base.css">
<style>
/* Layout: a hero with a shows-per-year chart, then a wall of ticket stubs grouped by year. */

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;padding-block:56px 36px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:end}
/* the warm glow runs to the edges of the window, not just the content column */
.hero::before{content:"";position:absolute;z-index:-1;top:0;bottom:-40px;left:calc(50% - 50vw);right:calc(50% - 50vw);pointer-events:none;
  background:radial-gradient(ellipse min(900px,90vw) 520px at max(20%,calc(50vw - 380px)) 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(56px,9vw,124px);line-height:.84;margin:10px 0 0;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
h1 .count{color:var(--accent)}
.lede{max-width:44ch;color:var(--muted);margin:18px 0 0;font-size:16px}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px;font-family:var(--mono);font-size:13px}
.facts b{font-weight:500;color:var(--fg)}
.facts span{color:var(--muted)}

.chart{min-width:0}
.chart h2{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:170px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;background:none;border:0;padding:0}
.bar i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--fg);opacity:.85;transition:opacity .15s}
.bar.zero i{height:2px!important;opacity:.25}
.bar:hover i{background:var(--accent);opacity:1}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.chart-head h2{margin:0}
.chart .seg button{padding:4px 10px;font-size:11px}
.gbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;align-items:center;max-height:196px;overflow-y:auto;font-family:var(--mono);font-size:11.5px;line-height:1.3}
.gbars button{all:unset;display:contents;cursor:pointer}
.gbars .g{color:var(--fg);white-space:nowrap;text-align:right}
.gbars .track{height:11px}
.gbars .track i{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--fg);opacity:.85;min-width:2px}
.gbars .c{color:var(--muted);font-variant-numeric:tabular-nums}
.gbars button:hover .track i,.gbars button[aria-pressed="true"] .track i{background:var(--accent);opacity:1}
.gbars button[aria-pressed="true"] .g{color:var(--accent)}
.gbars button:focus-visible .g{outline:2px solid var(--accent);outline-offset:2px}
.genre-select{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer}
.genre-select.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.years{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}

.facts a{color:inherit;text-decoration:none}
.facts a:hover b{text-decoration:underline}
.fact-btn{all:unset;cursor:pointer}
.fact-btn:hover b,.fact-btn[aria-pressed="true"] b{color:var(--accent)}
.fact-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.facts a.all b{color:var(--accent);font-weight:500}

/* ---------- memories: shows from this time of year, years ago ---------- */
.memories{padding-block:6px 30px}
.memories h2{font-family:var(--mono);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.mem-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.mem{display:flex;flex-direction:column;gap:4px;padding:14px 16px 15px;border:1px solid var(--line);border-left:4px solid var(--paper,var(--accent));border-radius:10px;background:var(--bg-2);text-decoration:none;min-width:0}
.mem:hover{border-color:var(--muted);border-left-color:var(--paper,var(--accent))}
.mem .when{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.mem.today{background:color-mix(in srgb,var(--accent) 12%,var(--bg-2));border-color:var(--accent)}
.mem .a{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.mem .v{font-size:13px;color:var(--muted)}

/* ---------- controls ---------- */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search{flex:1 1 280px;min-width:0;background:var(--bg-2);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;order:4}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg-2)}
.seg button{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1d1824}
.shown{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- year groups ---------- */
.year{display:grid;grid-template-columns:150px minmax(0,1fr);gap:28px;padding-block:34px;border-bottom:1px solid var(--line)}
.year-label{position:sticky;top:80px;align-self:start}
.year-label .y{font-family:var(--display);font-weight:800;font-size:68px;line-height:.9;color:transparent;-webkit-text-stroke:1.5px var(--fg)}
.year-label .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em}
.gap{padding-block:18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 20px}

/* ---------- ticket stub ---------- */
.stub{--paper:#f3a597;position:relative;display:grid;grid-template-columns:minmax(0,1fr) 54px;background:var(--paper);color:var(--ink);
  border-radius:6px;text-decoration:none;transform:rotate(var(--tilt,0deg));transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 1px 0 rgba(0,0,0,.25),0 8px 18px -10px rgba(0,0,0,.6)}
.stub:hover,.stub:focus-visible{transform:rotate(0) translateY(-4px);box-shadow:0 1px 0 rgba(0,0,0,.25),0 18px 28px -14px rgba(0,0,0,.7)}
.stub::before,.stub::after{content:"";position:absolute;right:46px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.stub::before{top:-8px}.stub::after{bottom:-8px}
.stub .main{padding:14px 14px 13px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stub .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.stub .artist{font-family:var(--display);font-weight:800;font-size:28px;line-height:.95;text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.stub .venue{font-size:13px;line-height:1.3}
.stub .venue small{display:block;color:var(--ink-soft);font-size:12px}
.stub .open{font-family:var(--mono);font-size:11px;color:var(--ink-soft);border-top:1px dashed color-mix(in srgb,var(--ink) 30%,transparent);padding-top:7px;margin-top:2px}
.stub .cov{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft)}
.stub .ticks{display:flex;gap:2px;flex:1;min-width:0;max-width:120px}
.stub .ticks i{flex:1;height:8px;border-radius:1px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.stub .ticks i.on{background:var(--ink)}
.stub .side{border-left:2px dashed color-mix(in srgb,var(--ink) 32%,transparent);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);gap:10px;padding-block:10px}
.stub .side b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:0;color:var(--ink)}
.stamp{position:absolute;bottom:14px;right:64px;transform:rotate(-8deg);font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.08em;color:#b3261e;border:2px solid #b3261e;border-radius:4px;padding:1px 6px;text-transform:uppercase;opacity:.9}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:36px;gap:28px}
  .year{grid-template-columns:1fr;gap:14px}
  .year-label{position:static;display:flex;align-items:baseline;gap:12px}
  .year-label .y{font-size:52px}
  .shown{margin-left:0;width:100%;order:5}
}
@media (prefers-reduced-motion:reduce){.stub{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow" id="eyebrow">&nbsp;</div>
      <h1><span class="count" id="total">—</span> <span id="shows-word">shows</span><br>and counting</h1>
      <p class="lede" id="lede"></p>
      <div class="facts" id="facts"></div>
    </div>
    <div class="chart">
      <div class="chart-head"><h2 id="chart-title">Shows per year</h2>
        <div class="seg" id="chart-view" role="group" aria-label="Chart"><button type="button" data-view="year" aria-pressed="true">By year</button><button type="button" data-view="genre" aria-pressed="false">By genre</button></div></div>
      <div id="by-year"><div class="bars" id="bars"></div><div class="years" id="years"></div></div>
      <div id="by-genre" hidden><div class="gbars" id="gbars"></div></div>
    </div>
  </header>

  <section class="memories" id="memories" hidden aria-labelledby="mem-title"><h2 id="mem-title">This time of year</h2><div class="mem-row" id="mem-row"></div></section>

  <div class="controls" role="search">
    <div class="seg" id="order" role="group" aria-label="Sort order"><button type="button" data-order="desc" aria-pressed="true">Newest first</button><button type="button" data-order="asc" aria-pressed="false">Oldest first</button></div>
    <input class="search" id="q" type="search" placeholder="Search artists, venues, openers, genres…" aria-label="Search shows">
    <div class="shown" id="shown"></div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="timeline"><div class="empty">Loading shows…</div></main>
  <footer class="site" id="foot">Stub colour shows the state the show was in.</footer>
</div>

<script src="assets/common.js"></script>
<script>
const {esc, region, regionName, paper, stubDate, longDate, today, getJSON} = CB;
let SHOWS = [], CFG = {};
const filt = {q:'', state:null, genre:'', with:'', filmed:false, order:'desc'};  // with: a name, '__solo' or '__none'

getJSON('data/concerts.json').then(data => {
  CFG = data.config; SHOWS = data.shows;
  if (!SHOWS.length) return emptyLog();
  SHOWS.sort((a,b) => a.date.localeCompare(b.date));
  SHOWS.forEach((s,i) => { s.no = i+1; s.st = region(s.location); s.y = +s.date.slice(0,4); s.tilt = (((i*37)%7)-3)*0.45; });
  init(); render();
}).catch(err => {
  document.getElementById('timeline').innerHTML = `<div class="empty">Couldn't load data/concerts.json. Run <code>python3 scripts/build.py --serve</code> and open the page from there.<br>${esc(err.message)}</div>`;
});

// A brand-new log (scripts/start_fresh.py leaves concerts.csv with just its headers).
function emptyLog(){
  document.title = CFG.site_title || 'Concert Log';
  document.getElementById('eyebrow').textContent = CFG.owner || ' ';
  document.getElementById('total').textContent = '0';
  document.getElementById('lede').textContent = CFG.tagline || '';
  document.querySelector('.chart').hidden = true;
  document.querySelector('.controls').hidden = true;
  document.getElementById('timeline').innerHTML = `<div class="empty">No shows yet. Add one row per show to <code>concerts.csv</code>
    (artist, date as YYYY-MM-DD, venue, city), push, and it appears here as a ticket stub.${CFG.repo_url ? ` The <a href="${esc(CFG.repo_url)}#readme">README</a> walks through it.` : ''}</div>`;
}

function init(){
  document.title = CFG.site_title || 'Concert Log';
  const y0 = Math.min(...SHOWS.map(s=>s.y)), y1 = Math.max(...SHOWS.map(s=>s.y));
  document.getElementById('eyebrow').textContent = [CFG.owner, `live music since ${y0}`].filter(Boolean).join(' · ');
  document.getElementById('lede').textContent = CFG.tagline || '';
  document.getElementById('total').textContent = SHOWS.length;
  document.getElementById('shows-word').textContent = SHOWS.length === 1 ? 'show' : 'shows';

  const count = k => { const m = {}; SHOWS.forEach(s => { const v = k(s); if (v) m[v] = (m[v]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const topA = count(s=>s.artist)[0], topV = count(s=>s.venue)[0], cities = new Set(SHOWS.map(s=>s.location)).size;
  const genreCounts = (() => { const m = {}; SHOWS.forEach(s => s.genres.forEach(g => m[g] = (m[g]||0)+1)); return Object.entries(m).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0])); })();
  // everyone in the companions column, most shows first
  const withCounts = (() => { const m = {}; SHOWS.forEach(s => CB.people(s.with).forEach(p => m[p] = (m[p]||0)+1));
    return Object.entries(m).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])); })();
  const solo = SHOWS.filter(s => CB.isSolo(s.with)).length, unlogged = SHOWS.filter(s => !s.with.trim()).length;
  const comp = CFG.highlight_companion, compN = comp ? SHOWS.filter(s => CB.people(s.with).some(p => p.toLowerCase() === comp.toLowerCase())).length : 0;
  const filmed = SHOWS.filter(s=>s.clips>0).length;
  const slug = t => t.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  document.getElementById('facts').innerHTML =
    `<a href="artist.html?a=${encodeURIComponent(slug(topA[0]))}"><span>Most seen</span> <b>${esc(topA[0])} ×${topA[1]}</b></a>
     <div><span>Home venue</span> <b>${esc(topV[0])} ×${topV[1]}</b></div>
     <div><span>Cities</span> <b>${cities}</b></div>
     ${genreCounts.length ? `<div><span>Top genre</span> <b>${esc(genreCounts[0][0])} ×${genreCounts[0][1]}</b></div>` : ''}
     ${comp && compN ? `<button type="button" class="fact-btn" data-with="${esc(comp)}"><span>With ${esc(comp)}</span> <b>${compN}</b></button>` : ''}
     ${filmed ? `<div><span>Shows with footage</span> <b>${filmed}</b></div>` : ''}
     <a class="all" href="stats.html"><b>All the stats →</b></a>`;
  memories();
  const params = new URLSearchParams(location.search);   // the stats page links here with ?q=Venue or ?with=Name
  if (params.get('q')){ filt.q = params.get('q').trim().toLowerCase(); document.getElementById('q').value = params.get('q'); }
  if (params.get('with')) filt.with = params.get('with');

  // chart
  const per = {}; SHOWS.forEach(s => per[s.y] = (per[s.y]||0)+1);
  const max = Math.max(...Object.values(per)); let b = '', l = '';
  for (let y=y0; y<=y1; y++){ const c = per[y]||0;
    b += `<button class="bar${c?'':' zero'}" data-year="${y}" aria-label="${y}: ${c} shows"><span>${c||''}</span><i style="height:${c/max*130}px"></i></button>`;
    l += `<span>'${String(y).slice(2)}</span>`; }
  const bars = document.getElementById('bars'); bars.innerHTML = b; document.getElementById('years').innerHTML = l;
  bars.addEventListener('click', e => { const t = e.target.closest('.bar'); if (!t) return;
    const el = document.getElementById('y'+t.dataset.year);
    if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block:'start'}); });

  // filters
  document.getElementById('order').addEventListener('click', e => { const btn = e.target.closest('button'); if (!btn) return;
    filt.order = btn.dataset.order; document.querySelectorAll('#order button').forEach(x => x.setAttribute('aria-pressed', x===btn)); render(); });
  const present = [...new Set(SHOWS.map(s=>s.st))];
  let h = present.map(k => `<button class="chip" data-state="${esc(k)}" aria-pressed="false"><span class="dot" style="background:${paper(k)}"></span>${esc(regionName(k))}</button>`).join('');
  if (genreCounts.length) h += `<select class="genre-select" id="genre" aria-label="Genre"><option value="">All genres</option>${genreCounts.map(([g,n]) => `<option value="${esc(g)}">${esc(g)} (${n})</option>`).join('')}</select>`;
  if (withCounts.length || solo) h += `<select class="genre-select" id="with" aria-label="Who you went with"><option value="">With anyone</option>
    ${withCounts.map(([p,n]) => `<option value="${esc(p)}">With ${esc(p)} (${n})</option>`).join('')}
    <option value="__solo">Solo (${solo})</option><option value="__none">Not logged (${unlogged})</option></select>`;
  if (filmed) h += `<button class="chip" id="filmed" aria-pressed="false">Has footage</button>`;
  const c = document.getElementById('chips'); c.innerHTML = h;
  c.addEventListener('click', e => { const btn = e.target.closest('.chip'); if (!btn) return;
    if (btn.id === 'filmed'){ filt.filmed = !filt.filmed; btn.setAttribute('aria-pressed', filt.filmed); }
    else { const k = btn.dataset.state; filt.state = filt.state===k ? null : k;
      c.querySelectorAll('[data-state]').forEach(x => x.setAttribute('aria-pressed', x.dataset.state===filt.state)); }
    render(); });
  document.getElementById('q').addEventListener('input', e => { filt.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById('genre')?.addEventListener('change', e => setGenre(e.target.value));
  document.getElementById('with')?.addEventListener('change', e => setWith(e.target.value));
  document.getElementById('facts').addEventListener('click', e => { const b = e.target.closest('[data-with]'); if (b) setWith(filt.with === b.dataset.with ? '' : b.dataset.with); });
  if (filt.with) setWith(filt.with, false);

  // genre chart: one bar per genre (a show can count under more than one); click to filter
  const gmax = genreCounts.length ? genreCounts[0][1] : 1;
  document.getElementById('gbars').innerHTML = genreCounts.map(([g,n]) =>
    `<button data-genre="${esc(g)}" aria-pressed="false" aria-label="${esc(g)}: ${n} shows"><span class="g">${esc(g)}</span><span class="track"><i style="width:${n/gmax*100}%"></i></span><span class="c">${n}</span></button>`).join('');
  document.getElementById('gbars').addEventListener('click', e => { const b = e.target.closest('[data-genre]'); if (b) setGenre(filt.genre === b.dataset.genre ? '' : b.dataset.genre); });
  if (!genreCounts.length) document.getElementById('chart-view').hidden = true;
  document.getElementById('chart-view').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    const g = b.dataset.view === 'genre';
    document.querySelectorAll('#chart-view button').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById('by-year').hidden = g; document.getElementById('by-genre').hidden = !g;
    document.getElementById('chart-title').textContent = g ? 'Shows by genre' : 'Shows per year'; });

  const foot = document.getElementById('foot');
  foot.innerHTML += ` <a href="concerts.csv" download>Download this log (CSV)</a> · <a href="concerts_template.csv" download>blank template</a>.`;
  if (CFG.repo_url) foot.innerHTML +=
    ` Made with ConcertBuddy — <a href="${esc(CFG.repo_url)}">grab the template and log your own shows</a>.`;
  if (CB.local) foot.innerHTML = `<a href="tag.html">Tag clips with songs</a> · <a href="people.html">Log who you went with</a> (local preview only) · ` + foot.innerHTML;
}

// Shows whose anniversary falls in the week before or two weeks after today, in past years.
function memories(){
  const t = CB.date(today()), out = [];
  for (const s of SHOWS){
    const d = CB.date(s.date);
    let ann = new Date(t.getFullYear(), d.getMonth(), d.getDate(), 12), diff = Math.round((ann - t) / 864e5);
    if (diff > 183){ ann.setFullYear(ann.getFullYear() - 1); diff = Math.round((ann - t) / 864e5); }
    if (diff < -183){ ann.setFullYear(ann.getFullYear() + 1); diff = Math.round((ann - t) / 864e5); }
    const years = ann.getFullYear() - d.getFullYear();
    if (years >= 1 && diff >= -7 && diff <= 14) out.push({s, diff, years});
  }
  if (!out.length) return;
  out.sort((a, b) => a.diff - b.diff || a.years - b.years);
  const when = x => (x.diff === 0 ? 'Today' : x.diff === 1 ? 'Tomorrow' : x.diff === -1 ? 'Yesterday' : x.diff > 0 ? `In ${x.diff} days` : `${-x.diff} days ago`)
    + ` · ${x.years === 1 ? 'a year' : x.years + ' years'} ago`;
  document.getElementById('mem-title').textContent = out.some(x => x.diff === 0) ? 'On this day' : 'This time of year';
  document.getElementById('mem-row').innerHTML = out.slice(0, 8).map(x => `<a class="mem${x.diff === 0 ? ' today' : ''}" href="show.html?id=${encodeURIComponent(x.s.id)}" style="--paper:${paper(x.s.st)}">
    <span class="when">${when(x)}</span><span class="a">${esc(x.s.artist)}</span>
    <span class="v">${esc(x.s.venue)} · ${esc(x.s.location)}${x.s.with ? ` · with ${esc(x.s.with)}` : ''}</span></a>`).join('');
  document.getElementById('memories').hidden = false;
}

function setWith(w, rerender = true){
  filt.with = w;
  const sel = document.getElementById('with');
  if (sel){ if (w && ![...sel.options].some(o => o.value === w)) sel.add(new Option(`With ${w} (0)`, w)); sel.value = w; sel.classList.toggle('on', !!w); }
  document.querySelectorAll('.facts [data-with]').forEach(b => b.setAttribute('aria-pressed', b.dataset.with === w));
  if (rerender) render();
}

function withMatches(s){
  if (!filt.with) return true;
  if (filt.with === '__solo') return CB.isSolo(s.with);
  if (filt.with === '__none') return !s.with.trim();
  return CB.people(s.with).some(p => p.toLowerCase() === filt.with.toLowerCase());
}

function setGenre(g){
  filt.genre = g;
  const sel = document.getElementById('genre'); if (sel){ sel.value = g; sel.classList.toggle('on', !!g); }
  document.querySelectorAll('#gbars [data-genre]').forEach(b => b.setAttribute('aria-pressed', b.dataset.genre === g));
  render();
}

function stub(s){
  const tonight = s.date === today();
  let cov = '';
  const sets = s.acts.filter(a => a.songs).length;
  if (s.songs && !s.filmed){
    cov = `<div class="cov"><span>${sets > 1 ? `${s.songs} songs · ${sets} sets` : `${s.songs}-song setlist`}</span></div>`;
  } else if (s.songs){
    const n = Math.min(s.songs, 24), on = Math.max(1, Math.round(s.filmed / s.songs * n));
    cov = `<div class="cov"><span class="ticks" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</span>
      <span>${s.filmed}/${s.songs} filmed</span></div>`;
  }
  return `<a class="stub" href="show.html?id=${encodeURIComponent(s.id)}" style="--paper:${paper(s.st)};--tilt:${s.tilt}deg" aria-label="${esc(s.artist)}, ${esc(s.venue)}, ${longDate(s.date)}">
    <div class="main">
      <div class="top"><span>Admit one</span><span>${stubDate(s.date)}</span></div>
      <div class="artist">${esc(s.artist)}</div>
      <div class="venue">${esc(s.venue)}<small>${esc(s.location)}</small></div>
      ${s.opener ? `<div class="open">w/ ${esc(s.opener)}</div>` : ''}
      ${cov}
    </div>
    <div class="side"><span>No.</span><b>${String(s.no).padStart(2,'0')}</b></div>
    ${tonight ? '<span class="stamp">Tonight</span>' : ''}
  </a>`;
}

function render(){
  const list = SHOWS.filter(s => {
    if (filt.state && s.st !== filt.state) return false;
    if (!withMatches(s)) return false;
    if (filt.filmed && !s.clips) return false;
    if (filt.genre && !s.genres.includes(filt.genre)) return false;
    if (filt.q && !(`${s.artist} ${s.venue} ${s.location} ${s.opener} ${s.with} ${s.notes} ${s.genres.join(' ')}`.toLowerCase().includes(filt.q))) return false;
    return true; });
  document.getElementById('shown').textContent = `Showing ${list.length} of ${SHOWS.length}`;
  const el = document.getElementById('timeline');
  if (!list.length){ el.innerHTML = '<div class="empty">No shows match. Try a different search or clear the filters.</div>'; return; }
  const by = {}; list.forEach(s => (by[s.y] = by[s.y] || []).push(s));
  const filtered = filt.q || filt.state || filt.genre || filt.with || filt.filmed, asc = filt.order === 'asc';
  const years = Object.keys(by).map(Number).sort((a,b) => asc ? a-b : b-a);
  let h = '', prev = null;
  years.forEach(y => {
    if (!filtered && prev && Math.abs(prev-y) > 1){ const a = Math.min(prev,y)+1, b = Math.max(prev,y)-1;
      h += `<div class="gap">${a===b ? a : a+'–'+b} · no shows</div>`; }
    const g = by[y].sort((a,b) => asc ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
    h += `<section class="year" id="y${y}"><div class="year-label"><div class="y">${y}</div><div class="n">${g.length} show${g.length>1?'s':''}</div></div>
      <div class="wall">${g.map(stub).join('')}</div></section>`;
    prev = y; });
  el.innerHTML = h;
}
</script>
